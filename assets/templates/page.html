<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ .Header.Title }}</title>
</head>
<body>
<header>
    <h1>{{ .Header.Title }}</h1>

    <p>
        <time datetime="{{ .Header.Date.Format "2006-01-02" }}">
        {{ .Header.Date.Format "2006-01-02" }}
        </time>
    </p>

    <p>Type: {{ .Header.Type }}</p>
    <p>Status: {{ .Header.Status }}</p>

    {{ if .Header.Tags }}
    <ul>
        {{ range .Header.Tags }}
        <li>
            <a href="../tags/{{ . | tagSlug }}.html">{{ . }}</a>
        </li>
        {{ end }}
    </ul>
    {{ end }}
</header>

<main>
    {{ .Markdown | markdown }}
</main>

<footer>
    <a href="../index.html">Back to index</a>
</footer>
</body>
</html>
